<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Jotla app prototype" viewport="900x920" subtitle="Calm day-record app for SEND families" -->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Jotla by SEN Help</title>
<!-- Home-screen app: name, icon, full-screen launch -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jotla">
<meta name="application-name" content="Jotla">
<meta name="theme-color" content="#F7F5F2">
<link rel="apple-touch-icon" href="jotla-icon-180.png">
<link rel="icon" type="image/png" href="jotla-icon-180.png">
<link rel="manifest" href="jotla.webmanifest">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="jotla.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EBE8E3; font-family: 'Outfit', system-ui, sans-serif; }
  #root { min-height: 100vh; font-family: 'Outfit', system-ui, sans-serif; }
  /* When launched from the home screen / on a real phone, fill the whole screen. */
  html.j-appmode, html.j-appmode body { background: #F7F5F2; height: 100%; overflow: hidden; }
</style>
<!-- Self-hosted (no CDN): the app must load with no network. Production React. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#1A56A8"/><stop offset="1" stop-color="#103a73"/>
      </linearGradient>
      <linearGradient id="jfg" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0" stop-color="#5b8ff0"/><stop offset="1" stop-color="#27c4ff"/>
      </linearGradient>
    </defs>
    <rect width="512" height="512" rx="112" fill="url(#jbg)"/>
    <text x="256" y="356" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="300" fill="url(#jfg)">J</text>
  </svg>
</template>

<!-- Precompiled bundle (build 1.8.0): plain JS transpiled ahead of time by
     tools/precompile.js, so no Babel runs on the phone. Edit the .jsx sources,
     re-run the tool (the test suite does it automatically), never edit min/ by
     hand. index.dev.html still loads the raw .jsx for quick iteration. -->
<script src="min/ios-frame.js"></script>
<script src="min/jotla-data.js"></script>
<script src="min/jotla-icons.js"></script>
<script src="min/jotla-illustrations.js"></script>
<script src="min/jotla-ui.js"></script>
<script src="min/jotla-parent-a.js"></script>
<script src="min/jotla-month.js"></script>
<script src="min/jotla-parent-b.js"></script>
<script src="min/jotla-child.js"></script>
<script src="min/jotla-onboard.js"></script>
<script src="min/jotla-app.js"></script>
<script>
// Offline support: register the service worker once the app has loaded.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* file:// or unsupported: app still runs online-style */ });
  });
}
</script>
</body>
</html>
